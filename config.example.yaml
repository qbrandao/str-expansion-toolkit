# Copy this file (e.g. config.yaml) and adapt the paths to your environment.
# All micromamba environments listed here (clair3, whatshap-env, vamos,
# trgt, longtr, last_env, tandem-env) must already exist on the execution
# machine.
#
# NOTE: TRGT is NOT run by default by `detect` (default --tools =
# vamos, tandem-genotypes, longtr). TRGT is designed for PacBio HiFi reads
# and has no official support for ONT -- it remains available via
# `--tools ... trgt ...` but its use on ONT data must be explicitly
# documented as off-label in any resulting publication.

reference: /home/user/scripts/GRCh38-GIABv3_std.fa

vamos:
  env_clair3: clair3
  env_whatshap: whatshap-env
  env_vamos: vamos
  model_prefix: /home/user/scripts/r1041_e82_400bps_sup_v500
  catalog: /home/user/scripts/vamos.motif.hg38.v2.1.e0.1.tsv

trgt:
  env: trgt
  mmi: /home/user/scripts/GRCh38-GIABv3_std_lrhq.mmi
  repeats_bed: /home/user/scripts/trgt.motifsTR.bed

tandem_genotypes:
  env_last: last_env
  env_tandem: tandem-env
  # Prefix of a LAST index already built with `lastdb` (the "ref" in the bash script)
  last_ref_db: /home/user/scripts/ref
  repeats_bed: /home/user/scripts/repeats.trf.bed

longtr:
  env: longtr
  # minimap2 index -- can be the same file as trgt.mmi (same reference
  # genome); the alignment is automatically reused if both tools run in
  # the same job.
  mmi: /home/user/scripts/GRCh38-GIABv3_std_lrhq.mmi
  # LongTR BED: chrom, start (1-based), end, motif[,motif2], [name] (no header)
  regions_bed: /home/user/scripts/longtr.regions.bed
