# Copie ce fichier (ex: config.yaml) et adapte les chemins à ton environnement.
# Tous les environnements micromamba listés ici (clair3, whatshap-env, vamos,
# trgt, longtr, last_env, tandem-env) doivent déjà exister sur la machine
# d'exécution.
#
# NOTE : TRGT n'est PAS lancé par défaut par `detect` (--tools par défaut =
# vamos, tandem-genotypes, longtr). TRGT est conçu pour des reads PacBio HiFi
# et n'a pas de support officiel pour l'ONT -- il reste disponible via
# `--tools ... trgt ...` mais son usage sur des données ONT doit être
# explicitement documenté comme hors cadre officiel dans toute publication.

reference: /home/user/scripts/GRCh38-GIABv3_std.fa

vamos:
  env_clair3: clair3
  env_whatshap: whatshap-env
  env_vamos: vamos
  model_prefix: /home/user/scripts/r1041_e82_400bps_sup_v500
  catalog: /home/user/scripts/vamos.motif.hg38.v2.1.e0.1.tsv

trgt:
  env: trgt
  mmi: /home/user/scripts/GRCh38-GIABv3_std_lrhq.mmi
  repeats_bed: /home/user/scripts/trgt.motifsTR.bed

tandem_genotypes:
  env_last: last_env
  env_tandem: tandem-env
  # Préfixe d'un index LAST déjà construit avec `lastdb` (le "ref" du script bash)
  last_ref_db: /home/user/scripts/ref
  repeats_bed: /home/user/scripts/repeats.trf.bed

longtr:
  env: longtr
  # Index minimap2 -- peut être le même fichier que trgt.mmi (même génome de
  # référence), l'alignement est réutilisé automatiquement si les deux outils
  # tournent dans le même run.
  mmi: /home/user/scripts/GRCh38-GIABv3_std_lrhq.mmi
  # BED LongTR : chrom, start(1-based), end, motif[,motif2], [nom] (pas d'en-tête)
  regions_bed: /home/user/scripts/longtr.regions.bed

